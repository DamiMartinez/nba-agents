name: Daily NBA Agent Execution

on:
  schedule:
    # Avoid the top-of-hour scheduler peak; content dates remain New York time.
    - cron: '10 11 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Eastern (New York) edition date YYYY-MM-DD (blank = today in New York)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nba-daily-publisher
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.5.1'
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: nba-publisher-agent/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('nba-publisher-agent/poetry.lock') }}
      
      - name: Install dependencies
        working-directory: ./nba-publisher-agent
        run: |
          poetry check --lock
          poetry install --no-interaction --only main
      
      - name: Set up Google Cloud credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            # Create credentials file in /tmp with restrictive permissions (read/write for owner only)
            umask 077
            CREDENTIALS_FILE="$(mktemp "${RUNNER_TEMP}/gcp-credentials.XXXXXX.json")"
            printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$CREDENTIALS_FILE"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> $GITHUB_ENV
            echo "Google Cloud credentials configured securely"
          else
            echo "Warning: GOOGLE_APPLICATION_CREDENTIALS secret not set. GCS uploads may fail."
          fi
      
      - name: Run NBA Agent
        working-directory: ./nba-publisher-agent
        env:
          EDITION_DATE: ${{ inputs.edition_date }}
          # Google Cloud credentials
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          # Google Cloud configuration
          GOOGLE_CLOUD_PROJECT: blog-content-manager-tag
          GOOGLE_CLOUD_LOCATION: us-central1
          # Google AI API configuration
          GOOGLE_GENAI_USE_VERTEXAI: "0"
          # Required: Set GOOGLE_API_KEY as a GitHub Secret in repository settings
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          args=()
          if [ -n "$EDITION_DATE" ]; then
            args+=(--edition-date "$EDITION_DATE")
          fi
          poetry run python run_agent.py "${args[@]}"
      
      - name: Clean up credentials
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
            echo "Credentials file cleaned up"
          fi
      
      - name: Upload generated audio files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nba-podcast-output-${{ github.run_number }}
          path: |
            nba-publisher-agent/audios/*.wav
            nba-publisher-agent/reports/*
          retention-days: 30
          if-no-files-found: ignore

