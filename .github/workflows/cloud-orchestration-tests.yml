name: Cloud orchestration tests

on:
  push:
    paths:
      - infrastructure/cloud-scheduler/**
      - .github/workflows/cloud-orchestration-tests.yml
  pull_request:
    paths:
      - infrastructure/cloud-scheduler/**
      - .github/workflows/cloud-orchestration-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r infrastructure/cloud-scheduler/requirements-test.txt
      - run: python infrastructure/cloud-scheduler/test_orchestrator.py -v
      - run: bash -n infrastructure/cloud-scheduler/deploy.sh
