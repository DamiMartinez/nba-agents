[project]
name = "nba-publisher-agent"
version = "0.2.0"
description = "Date-safe daily NBA podcast generation using Google ADK"
authors = [
    { name = "Damian Martinez Carmona", email = "damian.martinez.carmona@gmail.com" },
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "google-adk>=2.12.0,<3.0.0",
    "google-genai>=2.32.0,<3.0.0",
    "google-cloud-storage>=3.17.1,<4.0.0",
    "requests>=2.34.2,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
black = "^26.10.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
